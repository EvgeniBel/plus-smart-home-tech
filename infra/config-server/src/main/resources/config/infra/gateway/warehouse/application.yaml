spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: warehouse_service_route
          uri: lb://WAREHOUSE
          predicates:
            - Path=/warehouse/**
          filters:
            - PrefixPath=/api/v1
            - name: Retry
              args:
                retries: 3
                statuses: NOT_FOUND, INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE
                methods: GET, POST, PUT, DELETE
                exceptions: ru.yandex.practicum.exception.ProductNotFoundException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: true