# ===== ?????????? =====
spring.application.name=analyzer
# ===== POSTGRESQL =====
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=postgres
spring.datasource.password=password
# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ===== SQL INIT =====
spring.sql.init.mode=never
# ===== KAFKA =====
spring.kafka.bootstrap-servers=localhost:9092
custom.kafka.bootstrap-servers=localhost:9092
# ===== Hub Event Consumer =====
custom.kafka-hub-event.hub-event-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
custom.kafka-hub-event.hub-event-consumer.value-deserializer=ru.yandex.practicum.broker.HubEventDeserializer
custom.kafka-hub-event.hub-event-consumer.auto-offset-reset=earliest
custom.kafka-hub-event.hub-event-consumer.group-id=analyzer-hub-events
# ===== Snapshot Consumer =====
custom.kafka-snapshot.snapshot-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
custom.kafka-snapshot.snapshot-consumer.value-deserializer=ru.yandex.practicum.broker.SensorsSnapshotDeserializer
custom.kafka-snapshot.snapshot-consumer.auto-offset-reset=earliest
custom.kafka-snapshot.snapshot-consumer.group-id=analyzer-snapshots
# ===== gRPC (?????? ??? HubRouter) =====
grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.negotiation-type=plaintext
# ===== ??????????? =====
logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=WARN\

