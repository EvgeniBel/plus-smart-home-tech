# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Datasource - H2 (??? ??????????)
spring.datasource.url=jdbc:h2:mem:analyzer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA ??? H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Kafka Topics
kafka.topics.snapshots=telemetry.snapshots.v1
kafka.topics.hubs=telemetry.hubs.v1

# gRPC Client
grpc.client.hub-router.address=static://localhost:9090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

# App Settings
app.analyzer.poll-timeout=1000
app.analyzer.poll-timeout-hub=1000
app.analyzer.shutdown-timeout=5000

# Logging
logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate=WARN