# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Datasource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/analyzer
spring.datasource.username=analyzer
spring.datasource.password=analyzer
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Kafka Topics
kafka.topics.snapshots=telemetry.snapshots.v1
kafka.topics.hubs=telemetry.hubs.v1

# gRPC Client
grpc.client.hub-router.address=static://localhost:9090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

# App Settings
app.analyzer.poll-timeout=1000
app.analyzer.poll-timeout-hub=1000
app.analyzer.shutdown-timeout=5000

# Logging
logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate=WARN