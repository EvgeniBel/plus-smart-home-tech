spring.sql.init.mode=always
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5469/sht-analyzer-service
spring.datasource.username=postgres-sht-analyzer-service
spring.datasource.password=password
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Kafka ?????????
custom.kafka.bootstrap-servers=localhost:9092
# Hub Event Consumer
custom.kafka-hub-event.hub-event-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
custom.kafka-hub-event.hub-event-consumer.value-deserializer=ru.yandex.practicum.broker.HubEventDeserializer
custom.kafka-hub-event.hub-event-consumer.auto-offset-reset=earliest
custom.kafka-hub-event.hub-event-consumer.group-id=analyzer-hub-events
# Snapshot Consumer
custom.kafka-snapshot.snapshot-consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
custom.kafka-snapshot.snapshot-consumer.value-deserializer=ru.yandex.practicum.broker.SensorsSnapshotDeserializer
custom.kafka-snapshot.snapshot-consumer.auto-offset-reset=earliest
custom.kafka-snapshot.snapshot-consumer.group-id=analyzer-snapshots
# gRPC ?????? ??? HubRouter
grpc.client.hub-router.address=static://localhost:9091
# ???? ??????
spring.datasource.url=jdbc:h2:mem:analyzer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop