# Server
server.port=8080

# Logging
logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer (???????? ?????? ?? ????????)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=10
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000

# Kafka Consumer (????????? ?????? ??? ?????)
spring.kafka.consumer.group-id=collector-local
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
kafka.topics.sensor-events=telemetry.sensors.v1
kafka.topics.hub-events=telemetry.hubs.v1

# gRPC Server
grpc.server.port=59091
grpc.server.keep-alive-time=300
grpc.server.max-inbound-message-size=10485760

# REST limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# App settings
app.collector.shutdown-timeout=5000