server:
  port: 8081

spring:
  application:
    name: aggregator
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aggregator
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50  # ✅ Уменьшено для снижения нагрузки
    producer:
      batch-size: 8192      # ✅ Уменьшен размер батча
      linger-ms: 50         # ✅ Уменьшена задержка
      max-in-flight-requests-per-connection: 10

kafka:
  topics:
    sensors: telemetry.sensors.v1
    snapshots: telemetry.snapshots.v1

app:
  aggregation:
    poll-timeout: 1000
    shutdown-timeout: 5000

logging:
  level:
    ru.yandex.practicum: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN