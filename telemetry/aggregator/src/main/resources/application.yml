server:
  port: 8081

spring:
  application:
    name: aggregator
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aggregator-local      # ← ИЗМЕНЕНО
      auto-offset-reset: earliest     # ← ДОБАВЛЕНО
      enable-auto-commit: false
      max-poll-records: 20            # ← ДОБАВЛЕНО
    producer:
      batch-size: 8192
      linger-ms: 50
      max-in-flight-requests-per-connection: 10

kafka:
  topics:
    sensors: telemetry.sensors.v1     # ← ПРОВЕРИТЬ
    snapshots: telemetry.snapshots.v1 # ← ПРОВЕРИТЬ

app:
  aggregation:
    poll-timeout: 1000
    shutdown-timeout: 5000

logging:
  level:
    ru.yandex.practicum: DEBUG        # ← ВКЛЮЧИТЬ DEBUG ДЛЯ ОТЛАДКИ
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG