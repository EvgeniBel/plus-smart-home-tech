# Server
server.port=8081

# Spring Application
spring.application.name=aggregator
spring.main.allow-circular-references=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
spring.kafka.consumer.group-id=aggregator-local
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=20

# Kafka Producer
spring.kafka.producer.batch-size=8192
spring.kafka.producer.linger-ms=50
spring.kafka.producer.max-in-flight-requests-per-connection=10

# Kafka Topics
kafka.topics.sensors=telemetry.sensors.v1
kafka.topics.snapshots=telemetry.snapshots.v1

# Aggregation Settings
app.aggregation.poll-timeout=1000
app.aggregation.shutdown-timeout=5000

# Logging
logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=DEBUG
logging.level.org.apache.kafka.clients.producer=DEBUG